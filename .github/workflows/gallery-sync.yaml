name: Gallery sync

# Adds new "Share a photo with Mike" submissions (Tally → Google Sheet) to the gallery.
# Runs every 15 minutes, or on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-sync
  cancel-in-progress: false

env:
  SHEET_CSV_URL: https://docs.google.com/spreadsheets/d/1uuI-f3AKa9XpNege5u8380-0Tev4-u2_eFLcgfCXWmw/export?format=csv

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check the sheet for new submissions
        id: check
        env:
          CHECK_ONLY: '1'
        run: node .github/scripts/sync-gallery.mjs

      - name: Install image tools
        if: steps.check.outputs.new != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick libheif-examples

      - name: Add new submissions to the gallery
        if: steps.check.outputs.new != '0'
        run: node .github/scripts/sync-gallery.mjs

      - name: Publish (commit to main → AEM Code Sync)
        if: steps.check.outputs.new != '0'
        run: |
          if [ -z "$(git status --porcelain gallery)" ]; then
            echo "nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery
          git commit -m "Gallery: add new photo submissions"
          git push
